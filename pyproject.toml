[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-bank-analytics"
version = "0.1.0"
description = "Reproducible retail-bank customer 360, engagement, and credit-risk analytics portfolio project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=18,<24",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
