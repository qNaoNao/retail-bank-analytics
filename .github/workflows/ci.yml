name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests app
      - name: Test source-only clone
        run: pytest -ra
      - name: Build synthetic demo with the full SQL pipeline
        run: python scripts/build_demo.py
      - name: Project health check
        run: python scripts/check_setup.py
